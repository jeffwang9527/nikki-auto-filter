general:
  # 普通池：多源聚合，避免单一来源导致本地命中率过低。
  # 云端最多保留 100 个候选，之后由 Windows 本地 mihomo 测试普通访问。
  - id: jifeng250
    source: jifeng250/free-nodes
    url: https://raw.githubusercontent.com/jifeng250/free-nodes/main/clash.yaml
    path: input/general/jifeng250-free-nodes.yaml
    limit: 40
  - id: yoyapai
    source: yoyapai
    url: https://raw.githubusercontent.com/wzmwayne/proxy-node/main/output/yoyapai/clash.yaml
    path: input/general/yoyapai.yaml
    limit: 10
