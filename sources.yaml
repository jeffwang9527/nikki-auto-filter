    limit: 10
  - id: passcro
    source: zhangkaiitugithub/passcro
    url: https://raw.githubusercontent.com/wzmwayne/proxy-node/main/output/passcro/clash.yaml
    path: input/general/passcro.yaml
    limit: 10
  - id: anaer
