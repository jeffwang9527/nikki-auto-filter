general:
  # 普通池：改用独立聚合源 jifeng250/free-nodes，不再使用 Au1rxx。
  # 云端最多保留 100 个候选，随后交给 Windows 本地 mihomo 测试普通访问。
  - id: jifeng250-free-nodes
    source: jifeng250/free-nodes
    url: https://raw.githubusercontent.com/jifeng250/free-nodes/main/clash.yaml
    path: input/general/jifeng250-free-nodes.yaml
    limit: 100

chatgpt:
  # GPT 专用池：继续使用非 Au1rxx 的公开来源。
  # 与普通池出现相同节点不做跨池排除；两个最终池可以有重叠。
  - id: yoyapai
    source: yoyapai
    url: https://raw.githubusercontent.com/wzmwayne/proxy-node/main/output/yoyapai/clash.yaml
    path: input/chatgpt/yoyapai.yaml
    limit: 12
  - id: freesub
    source: Ruk1ng001/freeSub
    url: https://raw.githubusercontent.com/wzmwayne/proxy-node/main/output/freesub/clash.yaml
    path: input/chatgpt/freesub.yaml
    limit: 12
  - id: ripaojiedian
    source: ripaojiedian/freenode
    url: https://raw.githubusercontent.com/wzmwayne/proxy-node/main/output/ripaojiedian/clash.yaml
