general:
  # 普通池：多源；候选总上限 100。
  # 每个来源必须能由 GitHub API 验证到 7 天内的最新数据更新，否则本轮跳过。
  - id: free18
    source: free18/v2ray
    activity_repo: free18/v2ray
    activity_path: c.yaml
    url: https://raw.githubusercontent.com/free18/v2ray/main/c.yaml
    path: input/general/free18.yaml
    limit: 30
  - id: barabama
    source: Barabama/FreeNodes
    activity_repo: Barabama/FreeNodes
    activity_path: nodes/clashmeta.yaml
    url: https://raw.githubusercontent.com/Barabama/FreeNodes/main/nodes/clashmeta.yaml
    path: input/general/barabama-clashmeta.yaml
    limit: 25
  - id: freesub
    source: Ruk1ng001/freeSub
    activity_repo: Ruk1ng001/freeSub
    activity_path: clash.yaml
    url: https://raw.githubusercontent.com/Ruk1ng001/freeSub/main/clash.yaml
    path: input/general/freesub.yaml
    limit: 15
  - id: ripaojiedian
    source: ripaojiedian/freenode
    activity_repo: ripaojiedian/freenode
    activity_path: clash
    url: https://raw.githubusercontent.com/ripaojiedian/freenode/main/clash
    path: input/general/ripaojiedian.yaml
    limit: 10
  - id: anaer
    source: anaer/Sub
    activity_repo: anaer/Sub
    activity_path: clash.yaml
    url: https://raw.githubusercontent.com/anaer/Sub/main/clash.yaml
    path: input/general/anaer.yaml
    limit: 10
  - id: yoyapai
    source: yoyapai.com (via wzmwayne/proxy-node)
    activity_repo: wzmwayne/proxy-node
    activity_path: output/yoyapai/clash.yaml
    url: https://raw.githubusercontent.com/wzmwayne/proxy-node/main/output/yoyapai/clash.yaml
    path: input/general/yoyapai.yaml
    limit: 10

chatgpt:
  # GPT 专用池：与普通池允许重叠；只在池内去重，不做跨池去重。
  # 同样执行 7 天来源活跃度门槛。
  - id: yoyapai
    source: yoyapai.com (via wzmwayne/proxy-node)
    activity_repo: wzmwayne/proxy-node
    activity_path: output/yoyapai/clash.yaml
    url: https://raw.githubusercontent.com/wzmwayne/proxy-node/main/output/yoyapai/clash.yaml
    path: input/chatgpt/yoyapai.yaml
    limit: 12
  - id: freesub
    source: Ruk1ng001/freeSub
    activity_repo: Ruk1ng001/freeSub
    activity_path: clash.yaml
    url: https://raw.githubusercontent.com/Ruk1ng001/freeSub/main/clash.yaml
