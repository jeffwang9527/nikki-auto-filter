name: Update Nikki cloud candidate pool
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "input/**"
      - "output/**"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Update public sources
        run: |
          chmod +x update_sources.sh
          ./update_sources.sh
      - name: Build cloud candidate pool
        run: python cloud_candidates.py
      - name: Validate candidate pool
        run: |
          python - <<'PY'
          import yaml
          d=yaml.safe_load(open("output/candidates.yaml",encoding="utf-8"))
          n=len(d.get("proxies",[])) if isinstance(d,dict) else 0
          assert 0 < n <= 100, f"unexpected candidate count: {n}"
          print("candidate nodes:",n)
          PY
      - name: Commit candidate pool
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add input output/candidates.yaml output/cloud_stats.json
          git diff --cached --quiet || git commit -m "update cloud candidate pool"
          git push
