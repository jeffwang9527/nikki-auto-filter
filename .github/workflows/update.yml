name: Update Nikki Nodes


on:

  schedule:

    - cron: "0 */4 * * *"


  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:


    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4
      with:
          token: ${{ secrets.GITHUB_TOKEN }}


    - name: Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: Install

      run: |

        pip install -r requirements.txt



    - name: Update sources

      run: |

        chmod +x update_sources.sh

        ./update_sources.sh



    - name: Filter

      run: |

        python filter_nodes.py



    - name: Commit

      run: |

    git config user.name github-actions
    git config user.email github-actions@github.com

    git add .

    git diff --cached --quiet || git commit -m "auto update nodes"

    git push