# Nikki/Mihomo profile mixin for the two local-tested node pools.
# No YAML anchors are used because Nikki has had first-start issues with
# anchor/merge constructs in proxy-providers on some versions.
#
# The two provider URLs are the small files published by the Windows local
# testing stage. Nikki downloads them directly; no second download daemon is
# required on the router.

proxy-providers:
  NIKKI-GENERAL:
    type: http
    url: "https://cdn.jsdelivr.net/gh/jeffwang9527/nikki-auto-filter@main/output/nikki-general.yaml"
    path: ./providers/proxy/nikki-general.yaml
    interval: 14400
    size-limit: 2000000
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  NIKKI-GPT:
    type: http
    url: "https://cdn.jsdelivr.net/gh/jeffwang9527/nikki-auto-filter@main/output/nikki-chatgpt.yaml"
    path: ./providers/proxy/nikki-chatgpt.yaml
    interval: 14400
    size-limit: 2000000
    health-check:
      enable: true
      url: https://chatgpt.com/robots.txt
      interval: 300

proxy-groups:
  - name: "NIKKI-普通池"
    type: url-test
    use:
      - NIKKI-GENERAL
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "NIKKI-GPT专用池"
    type: url-test
    use:
      - NIKKI-GPT
    url: https://chatgpt.com/robots.txt
    interval: 300
    tolerance: 50

rules:
  # GPT/OpenAI must match before any domestic/direct/default proxy rules.
  - DOMAIN-SUFFIX,chatgpt.com,NIKKI-GPT专用池
  - DOMAIN-SUFFIX,openai.com,NIKKI-GPT专用池
  - DOMAIN-SUFFIX,oaistatic.com,NIKKI-GPT专用池
  - DOMAIN-SUFFIX,oaiusercontent.com,NIKKI-GPT专用池

  # Keep LAN/private traffic direct.
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

  # Common services should stay direct.
  - DOMAIN-SUFFIX,adobe.com,DIRECT
  - DOMAIN-SUFFIX,adobelogin.com,DIRECT
  - DOMAIN-SUFFIX,adobe.io,DIRECT

  - DOMAIN-SUFFIX,microsoft.com,DIRECT
  - DOMAIN-SUFFIX,microsoftonline.com,DIRECT
  - DOMAIN-SUFFIX,office.com,DIRECT
  - DOMAIN-SUFFIX,live.com,DIRECT

  - DOMAIN-SUFFIX,apple.com,DIRECT
  - DOMAIN-SUFFIX,icloud.com,DIRECT

  - DOMAIN-SUFFIX,steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT
  - DOMAIN-SUFFIX,steamstatic.com,DIRECT

  - DOMAIN-SUFFIX,alipay.com,DIRECT
  - DOMAIN-SUFFIX,alipayobjects.com,DIRECT
  - DOMAIN-SUFFIX,unionpay.com,DIRECT

  # China traffic direct; all remaining external traffic goes to the general pool.
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,NIKKI-普通池
