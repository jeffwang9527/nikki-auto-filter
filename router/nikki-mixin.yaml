  - DOMAIN-SUFFIX,adobestats.io,REJECT
  - DOMAIN-SUFFIX,services.adobe.com,REJECT
  - DOMAIN-SUFFIX,commerce.adobe.com,REJECT
  - DOMAIN-SUFFIX,service.account.adobe.com,REJECT
  - DOMAIN-SUFFIX,crs.cr.adobe.com,REJECT
  - DOMAIN-SUFFIX,adobe.com,DIRECT
  - DOMAIN-SUFFIX,adobelogin.com,DIRECT
  - DOMAIN-SUFFIX,adobecc.com,DIRECT
  - DOMAIN-SUFFIX,adobecces.com,DIRECT
  - DOMAIN-SUFFIX,adobeccstatic.com,DIRECT
  - DOMAIN-SUFFIX,adobedtm.com,DIRECT
  - DOMAIN-SUFFIX,adobeexchange.com,DIRECT
