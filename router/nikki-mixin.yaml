# Nikki/Mihomo profile mixin for the two local-tested node pools.
# No YAML anchors are used because Nikki has had first-start issues with
# anchor/merge constructs in proxy-providers on some versions.
#
# The two provider URLs are the small files published by the Windows local
# testing stage. Nikki downloads them directly; no second download daemon is
# required on the router.

proxy-providers:
  NIKKI-GENERAL:
    type: file
    path: /etc/nikki/run/nikki-general.yaml
    health-check:
      enable: true
      url: https://www.google.com/generate_204
      interval: 300

  NIKKI-GPT:
    type: file
    path: /etc/nikki/run/nikki-chatgpt.yaml
    health-check:
      enable: true
      url: https://chatgpt.com/robots.txt
      interval: 300

proxy-groups:
  - name: "NIKKI-普通池"
    type: url-test
    use:
      - NIKKI-GENERAL
    url: https://www.google.com/generate_204
    interval: 300
    tolerance: 50

  - name: "NIKKI-GPT专用池"
    type: url-test
    use:
      - NIKKI-GPT
    url: https://chatgpt.com/robots.txt
    interval: 300
    tolerance: 50
  # Google 相关域名：优先普通池 provider，普通池节点不通自动回退到 GPT provider
  # 注意：mihomo fallback 组 use 只支持 proxy-provider，不支持 proxy-group
  - name: "NIKKI-GOOGLE回退"
    type: fallback
    use:
      - NIKKI-GENERAL
      - NIKKI-GPT
    url: https://www.google.com/generate_204
    interval: 300
    tolerance: 50

rules:
  # GPT/OpenAI 必须最前
  - DOMAIN-SUFFIX,chatgpt.com,NIKKI-GPT专用池
  - DOMAIN-SUFFIX,openai.com,NIKKI-GPT专用池
  - DOMAIN-SUFFIX,oaistatic.com,NIKKI-GPT专用池
  - DOMAIN-SUFFIX,oaiusercontent.com,NIKKI-GPT专用池
  # Google：普通池不通时经 fallback 自动切到 GPT 专用池
  - DOMAIN-SUFFIX,google.com,NIKKI-GOOGLE回退
  - DOMAIN-SUFFIX,googleapis.com,NIKKI-GOOGLE回退
  - DOMAIN-SUFFIX,gstatic.com,NIKKI-GOOGLE回退
  - DOMAIN-SUFFIX,googleusercontent.com,NIKKI-GOOGLE回退
  - DOMAIN-SUFFIX,googletagmanager.com,NIKKI-GOOGLE回退
  - DOMAIN-SUFFIX,google-analytics.com,NIKKI-GOOGLE回退

  # LAN
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

  # Adobe：屏蔽正版验证与授权判定服务，保留启动必需服务直连，保证破解版可正常启动且不弹窗
  # lose access 判定走多组域名：genuine 验证 / adobe.io 判定服务 / 账户与商务状态，须逐组屏蔽
  - DOMAIN-SUFFIX,adobegenuine.com,REJECT
  - DOMAIN-SUFFIX,genuine.adobe.com,REJECT
